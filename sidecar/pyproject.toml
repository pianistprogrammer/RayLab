[project]
name = "raylab-sidecar"
version = "0.1.0"
description = "FastAPI sidecar for RayLab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "requests>=2.32.0",
  "psutil>=6.1.0",
  "keyring>=25.6.0"
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "httpx>=0.28.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
