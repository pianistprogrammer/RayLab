name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "vendor/**"
      - ".github/workflows/windows-build.yml"

jobs:
  windows:
    name: Test and bundle Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Frontend tests
        run: corepack pnpm --filter @raylab/frontend test

      - name: Frontend production build
        run: corepack pnpm --filter @raylab/frontend build

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installers
        run: corepack pnpm tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: raylab-windows-nsis-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: raylab-windows-msi-x64
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
